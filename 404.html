<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa bulunamadı | HB Otomatik Şanzıman</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0d14">
  <link rel="icon" type="image/png" href="/assets/img/logo-hb-square.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/styles.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 24px; }
    .nf .code { font-family: var(--ff-display); font-weight: 800; font-size: clamp(4rem, 14vw, 8rem); line-height: 1; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf h1 { font-family: var(--ff-display); font-size: clamp(1.4rem, 4vw, 2rem); margin: 12px 0 10px; }
    .nf p { color: var(--text-soft); max-width: 460px; margin: 0 auto 28px; }
    .nf .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .nf .logo { height: 56px; width: auto; margin: 0 auto 24px; }
  </style>
</head>
<body>
  <div class="nf">
    <div>
      <img src="/assets/img/logo-hb.webp" width="480" height="480" class="logo" alt="HB Otomatik Şanzıman">
      <div class="code">404</div>
      <h1>Aradığınız sayfa bulunamadı</h1>
      <p>Bağlantı değişmiş veya kaldırılmış olabilir. Aşağıdan ana sayfaya dönebilir ya da doğrudan bize ulaşabilirsiniz.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Ana Sayfaya Dön</a>
        <a href="tel:+905304918005" class="btn btn-ghost">0530 491 80 05</a>
      </div>
    </div>
  </div>
</body>
</html>
